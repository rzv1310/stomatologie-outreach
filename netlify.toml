[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "og"
  path = "/*"

[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
